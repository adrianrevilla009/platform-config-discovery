services:
  config-server:
    image: hyness/spring-cloud-config-server:4.1.3
    ports: ["8888:8888"]
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:///config-repo
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
    volumes:
      - ${CONFIG_REPO_DIR:-/tmp/pcd-config-repo}:/config-repo:ro
